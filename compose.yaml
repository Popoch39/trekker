name: trekker

services:
  postgres:
    # Image PostGIS et non `postgres:17-alpine` : les traces de randonnee sont
    # des `geometry(linestring,4326)`. Ses scripts d'initdb jouent deja
    # `CREATE EXTENSION postgis`. Changer d'image impose de recreer le volume
    # (`docker compose down -v`) : les deux images ne partagent pas leur
    # repertoire de donnees.
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trekker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trekker}
      POSTGRES_DB: ${POSTGRES_DB:-trekker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-trekker} -d ${POSTGRES_DB:-trekker}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
